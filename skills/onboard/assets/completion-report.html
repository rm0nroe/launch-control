:root { --display: 'LC Display', Impact, sans-serif; --label: 'LC Label', 'Arial Narrow', sans-serif; --mono: 'LC Mono', ui-monospace, Menlo, monospace; --ease: cubic-bezier(.16, 1, .3, 1); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid #E8A33D; outline-offset: 3px; }
body { font: 500 16px/1.45 var(--label); letter-spacing: .01em; background: #F1EADC; }
#report { min-height: 100vh; }
.cmd { font: 400 13px/1.2 var(--mono); padding: 8px 11px; border: 1px solid currentColor; border-color: color-mix(in srgb, currentColor 22%, transparent); border-radius: 3px; text-align: left; word-break: break-all; transition: border-color .2s, background .2s; }
.cmd:hover { border-color: var(--amber); }
.cmd.copied { background: var(--amber); color: var(--ink); border-color: var(--amber); }
.cmds { display: flex; flex-wrap: wrap; gap: 6px; }

/* Vehicle drawing: composition fixed, colors only from tokens. */
.vb { background-color: var(--bg); color: var(--line); --g1: color-mix(in srgb, var(--gridc, var(--line)) var(--grid, 7%), transparent); --g2: color-mix(in srgb, var(--gridc, var(--line)) calc(var(--grid, 7%) / 2), transparent);
  background-image: linear-gradient(var(--g1) 1px, transparent 1px), linear-gradient(90deg, var(--g1) 1px, transparent 1px), linear-gradient(var(--g2) 1px, transparent 1px), linear-gradient(90deg, var(--g2) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
.b-sheet { max-width: 1320px; margin: 0 auto; padding: clamp(16px, 3vw, 40px); }
.b-frame { border: 2px solid var(--rule, var(--line)); position: relative; display: grid; grid-template-columns: minmax(300px, 440px) 1fr; }
.b-frame::before { content: ""; position: absolute; inset: 6px; border: 1px solid color-mix(in srgb, var(--line) 40%, transparent); pointer-events: none; }
.b-draw { border-right: 1px solid var(--rule, var(--line)); padding: 28px 12px 20px; position: relative; }
.b-draw svg { width: 100%; height: auto; display: block; overflow: visible; }
.b-draw .outline { fill: none; stroke: var(--rule, var(--line)); stroke-width: 1.6; stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: b-draw 2.2s var(--ease) forwards .2s; }
.b-seg { cursor: pointer; }
.b-seg rect, .b-seg path.body { fill: var(--bg); stroke: var(--rule, var(--line)); stroke-width: 1.6; transition: fill .3s; }
.b-seg .hatch { opacity: 0; transition: opacity .3s; }
.b-seg:hover .hatch, .b-seg:focus-visible .hatch { opacity: .6; }
.b-seg.on .hatch { opacity: .32; }
.b-seg:hover .hatch { opacity: .45; }
.b-seg.on rect, .b-seg.on path.body { fill: var(--accent); }
.b-seg text { font: 700 13px var(--label); letter-spacing: .18em; fill: var(--line); text-transform: uppercase; }
.b-seg .lead { stroke: var(--rule, var(--line)); stroke-width: 1; fill: none; }
.b-seg .num { font: 400 30px var(--display); letter-spacing: 0; fill: var(--numc, var(--line)); }
.b-seg:focus-visible { outline: none; }
.b-seg:focus-visible .lead { stroke: var(--signal); stroke-width: 2; }
.b-dim { font: 11px var(--mono); fill: color-mix(in srgb, var(--line) 60%, transparent); }
.b-side { display: grid; grid-template-rows: auto 1fr auto; }
.b-title { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--rule, var(--line)); }
.b-title > div { padding: 10px 14px; border-right: 1px solid var(--rule, var(--line)); min-width: 0; }
.b-title > div:last-child { border-right: 0; }
.b-title small { display: block; font: 700 10px var(--label); letter-spacing: .24em; text-transform: uppercase; opacity: .6; }
.b-title b { font: 600 16px var(--label); letter-spacing: .04em; word-break: break-all; }
.b-title .big { grid-column: span 4; border-right: 0; border-bottom: 1px solid var(--rule, var(--line)); padding: 18px 14px 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.b-title .big h1 { margin: 0; font: 400 clamp(52px, 7vw, 104px)/.86 var(--display); text-transform: uppercase; letter-spacing: .01em; word-break: break-word; }
.b-title .big .wm { height: 22px; width: auto; }
.b-title .big .wm path { fill: var(--line); }
.b-body { padding: 22px 24px; display: grid; grid-template-columns: 1fr 260px; gap: 28px; align-content: start; }
.b-man h2 { margin: 0; font: 400 46px/1 var(--display); text-transform: uppercase; display: flex; align-items: baseline; gap: 14px; }
.b-man h2 span { font: 700 13px var(--label); letter-spacing: .24em; opacity: .6; }
.b-man p { margin: 6px 0 16px; font-size: 15px; opacity: .75; }
.b-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule, var(--line)); }
.b-list li { display: grid; grid-template-columns: 34px 1fr auto; align-items: baseline; padding: 9px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 25%, transparent); font: 600 17px var(--label); animation: b-row .5s var(--ease) both; animation-delay: calc(var(--i) * 40ms); }
.b-list li .n { font: 11px var(--mono); opacity: .55; }
.b-list li .s { font: 700 11px var(--label); letter-spacing: .2em; opacity: .55; }
.b-list li.new .s, .b-list li.updated .s { color: var(--newc, var(--signal)); opacity: 1; }
.b-list li small { display: block; font: 11px var(--mono); opacity: .55; font-weight: 400; }
.b-stamp { align-self: start; border: 3px solid var(--signal); color: var(--signal); padding: 14px 16px; transform: rotate(-4deg); animation: b-stamp .45s cubic-bezier(.3, 1.6, .5, 1) both 1.4s; box-shadow: inset 0 0 0 2px var(--bg), inset 0 0 0 4px var(--signal); }
.b-stamp.go { border-color: var(--go); color: var(--go); box-shadow: inset 0 0 0 2px var(--bg), inset 0 0 0 4px var(--go); }
.b-stamp strong { display: block; font: 400 34px/.95 var(--display); text-transform: uppercase; }
.b-stamp p { margin: 8px 0 0; font: 600 15px/1.3 var(--label); color: var(--line); }
.b-stamp .adv { font-size: 13px; opacity: .8; margin-top: 10px; }
.b-stations { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule, var(--line)); }
.b-stations div { padding: 12px 14px; border-right: 1px solid var(--rule, var(--line)); }
.b-stations div:last-child { border-right: 0; }
.b-stations small { display: block; font: 700 10px var(--label); letter-spacing: .22em; text-transform: uppercase; opacity: .6; }
.b-stations b { font: 400 22px var(--display); letter-spacing: .04em; }
.b-stations b.go { color: var(--go); } .b-stations b.caution { color: var(--signal); } .b-stations b.standby { opacity: .55; }

  { id: 'crew', label: 'Crew', sub: 'Agents', test: (p) => p.startsWith('.claude/agents/'), name: (p) => p.split('/').pop().replace(/\.md$/, '') },
  { id: 'skills', label: 'Skills', sub: 'Playbooks agents follow', test: (p) => /^\.claude\/skills\/[^/]+\//.test(p), name: (p) => p.split('/')[2] },
  { id: 'commands', label: 'Commands', sub: 'Slash controls', test: (p) => p.startsWith('.claude/commands/'), name: (p) => '/' + p.split('/').pop().replace(/\.md$/, '') },
  { id: 'guidance', label: 'Guidance', sub: 'Hooks and permissions', test: (p) => p.startsWith('.claude/hooks/') || p === '.claude/settings.json', name: (p) => p === '.claude/settings.json' ? 'permissions' : p.split('/').pop() },
  { id: 'docs', label: 'Flight docs', sub: 'Context agents read', test: (p) => /^(CLAUDE\.md|AGENTS\.md|artifacts\/)/.test(p), name: (p) => p.split('/').pop() },
  { id: 'support', label: 'Support', sub: 'Everything else', test: () => true, name: (p) => p },
];
const cats = CATS.map((c) => ({ ...c, items: new Map() }));
Object.keys(STATUS).forEach((label) => {
  const s = sec(label); if (!s) return;
  s.items.forEach((p) => {
    if (typeof p !== 'string') return;
    const c = cats.find((x) => x.test(p)); const name = c.name(p);
    const cur = c.items.get(name) || { name, status: STATUS[label], files: [] };
    if (RANK[STATUS[label]] > RANK[cur.status]) cur.status = STATUS[label];
    cur.files.push(p); c.items.set(name, cur);
  });
});
const loadout = cats.map((c) => ({ ...c, items: [...c.items.values()] })).filter((c) => c.items.length);
const all = loadout.flatMap((c) => c.items);
const fresh = all.filter((i) => i.status !== 'aboard').length;
const SUMMARY = fresh ? fresh + ' new this run' : 'Nothing new this run';

// ---- go / no-go: GO only where the report states the good value ----
const STATIONS = [['settings-json', 'Permissions'], ['hooks', 'Hooks'], ['dependencies', 'Dependencies']];
const verdict = (k, v) => {
  if (k === 'settings-json') return v === 'valid' ? 'go' : 'standby';
  if (k === 'hooks') return /^(enabled|preserved)$/.test(v) ? 'go' : 'standby';
  if (k === 'dependencies') return v === 'ready' ? 'go' : 'caution';
  return 'standby';
};
const TG = { go: 'GO', caution: 'CAUTION', standby: 'STANDBY' };
const stations = STATIONS.filter(([k]) => R.checks.some((c) => c.key === k)).map(([k, label]) => {
  const v = checkVal(k); const [value, why] = v.split(' -- ');
  return { key: k, label, raw: v, value, why: why || '', tag: verdict(k, v) };
});
const branch = checkVal('branch');
const ADVISORY = ['Doc warnings', 'Stale AGENTS.md', 'Symlinked manifest paths', 'Protected, content unverified', 'Unrepresentable path names', 'Notes'];
const advisories = ADVISORY.map(sec).filter(Boolean).map((s) => ({ label: s.label, lines: s.items.map((x) => typeof x === 'string' ? x : x.dir).concat(s.notes) }));
const documented = sec('Documented gates'), undeclared = sec('Undeclared gates');

// ---- shared builders ----
const copyCmd = (text) => {
  const b = el('button', 'cmd', text); b.type = 'button'; b.title = 'Copy command';
  b.addEventListener('click', () => {
    const ok = () => { b.classList.add('copied'); b.setAttribute('aria-label', 'Copied ' + text); setTimeout(() => { b.classList.remove('copied'); b.removeAttribute('aria-label'); }, 900); };
    const fallback = () => { const t = el('textarea'); t.value = text; document.body.append(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} t.remove(); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  });
  return b;
};

// ---- Vehicle drawing: the loadout as clickable stages ----
function buildB(root) {
  root.classList.add('vb');
  const sheet = el('div', 'b-sheet'); root.append(sheet);
  const frame = el('div', 'b-frame'); sheet.append(frame);
  const NS = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs, text) => { const n = document.createElementNS(NS, tag); Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v)); if (text != null) n.textContent = text; return n; };
  const draw = el('div', 'b-draw');
  const svg = s('svg', { viewBox: '0 0 440 820', role: 'group', 'aria-label': 'Vehicle diagram: select a section' });
  const defs = s('defs'); const pid = 'b-hatch-' + root.id; const pat = s('pattern', { id: pid, width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }); pat.append(s('line', { x1: 0, y1: 0, x2: 0, y2: 8, 'stroke-width': 1.4 })); defs.append(pat); svg.append(defs);
  const order = ['crew', 'skills', 'commands', 'guidance', 'docs', 'support'];
  const segs = order.map((id) => loadout.find((c) => c.id === id)).filter(Boolean);
  // Heights follow item counts within a floor, so the vehicle shape stays legible.
  const total = segs.reduce((a, c) => a + Math.max(2, c.items.length), 0); const avail = 560; let y = 40;
  const X = 70, W = 110, cx = X + W / 2;
  const segEls = [];
  segs.forEach((c, i) => {
    const hgt = Math.round(avail * Math.max(2, c.items.length) / total);
    const g = s('g', { class: 'b-seg', tabindex: 0, role: 'button', 'aria-label': c.label + ', ' + c.items.length + ' items' });
    let shape;
    if (i === 0) shape = s('path', { class: 'body', d: `M${cx} ${y} C${X + W - 8} ${y + hgt * .35} ${X + W} ${y + hgt * .7} ${X + W} ${y + hgt} L${X} ${y + hgt} C${X} ${y + hgt * .7} ${X + 8} ${y + hgt * .35} ${cx} ${y} Z` });
    else shape = s('rect', { x: X, y, width: W, height: hgt });
    const hatch = shape.cloneNode(); hatch.setAttribute('class', 'hatch'); hatch.style.fill = 'url(#' + pid + ')';
    const ly = y + hgt / 2;
    g.append(shape, hatch, s('path', { class: 'lead', d: `M${X + W} ${ly} L${X + W + 40} ${ly} L${X + W + 58} ${ly - 16} L430 ${ly - 16}` }));
    g.append(s('text', { x: X + W + 62, y: ly - 24, class: 'num' }, String(c.items.length).padStart(2, '0')));
    g.append(s('text', { x: X + W + 110, y: ly - 24 }, c.label));
    g.append(s('text', { x: 14, y: ly + 4, class: 'b-dim' }, String(i + 1).padStart(2, '0')));
    g.addEventListener('click', () => select(c.id)); g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(c.id); } });
    svg.append(g); segEls.push([c.id, g]); y += hgt;
  });
  // engine and fins: drawing only
  svg.append(s('path', { class: 'outline', d: `M${X + 20} ${y} L${X + W - 20} ${y} L${X + W - 4} ${y + 70} L${X + 4} ${y + 70} Z M${X} ${y - 120} L${X - 34} ${y + 20} L${X} ${y} M${X + W} ${y - 120} L${X + W + 34} ${y + 20} L${X + W} ${y} M${cx} 20 L${cx} 40` }));
  svg.append(s('line', { x1: 40, y1: 40, x2: 40, y2: y, stroke: 'currentColor', 'stroke-opacity': .45, 'stroke-dasharray': '3 4' }));
  svg.append(s('text', { x: 18, y: y + 100, class: 'b-dim' }, 'SCALE: 1 SECTION = 1 SYSTEM CLASS'));
  draw.append(svg); frame.append(draw);

  const side = el('div', 'b-side'); frame.append(side);
  const tb = el('div', 'b-title');
  const big = el('div', 'big'); big.append(el('h1', null, R.repo), wm()); tb.append(big);
  [['Drawing', 'Onboard report'], ['Branch', branch], ['Systems', String(all.length)], ['This run', SUMMARY]].forEach(([k, v]) => { const d = el('div'); d.append(el('small', null, k), el('b', null, v)); tb.append(d); });
  side.append(tb);
  const body = el('div', 'b-body'); side.append(body);
  const man = el('div', 'b-man'); body.append(man);
  const stamp = el('div', 'b-stamp' + (R.next.length ? '' : ' go'));
  stamp.append(el('strong', null, R.next.length ? 'Hold · ' + R.next.length + ' action' : 'Go for launch'));
  R.next.forEach((n) => stamp.append(el('p', null, n)));
  advisories.forEach((a) => stamp.append(el('p', 'adv', a.label + ': ' + a.lines.join(' '))));
  body.append(stamp);
  const st = el('div', 'b-stations'); stations.forEach((x) => { const d = el('div'); d.title = x.raw; d.append(el('small', null, x.label), el('b', x.tag, TG[x.tag])); st.append(d); }); side.append(st);

  function select(id) {
    const c = loadout.find((x) => x.id === id);
    segEls.forEach(([sid, g]) => { g.classList.toggle('on', sid === id); g.setAttribute('aria-pressed', String(sid === id)); });
    man.textContent = '';
    const h = el('h2', null, c.label); h.append(el('span', null, c.items.length + ' on manifest')); man.append(h, el('p', null, c.sub));
    const ul = el('ul', 'b-list'); c.items.forEach((it, i) => { const li = el('li', it.status); li.style.setProperty('--i', i); const nm = el('span', null, it.name); if (it.files.length > 1) nm.append(el('small', null, it.files.length + ' files')); li.append(el('span', 'n', String(i + 1).padStart(2, '0')), nm, el('span', 's', WORD[it.status])); ul.append(li); });
    man.append(ul);
  }
  if (segs.length) select(segs.find((c) => c.id === 'skills') ? 'skills' : segs[0].id);

  sheet.append(finalChecks(), audit());
}

// ---- Pre-flight checklist and audit log ----
const undSources = () => undeclared ? undeclared.groups.map((g) => g.label) : [];
const cmdGroup = (items) => { const c = el('div', 'cmds'); items.forEach((x) => c.append(copyCmd(x))); return c; };
const undBody = () => { const box = el('div'); undeclared.groups.forEach((g) => { box.append(el('div', 'b-src', g.label)); box.append(cmdGroup(g.items)); }); return box; };
const chevron = () => el('span', 'chev');
// A disclosure that looks like a control: bordered bar, verb, chevron, and a preview of what is inside.
const disclosure = (cls, title, sub, body, open) => {
  const wrap = el('div', 'dz ' + cls); const btn = el('button', 'dz-bar'); btn.type = 'button'; btn.setAttribute('aria-expanded', String(!!open));
  const txt = el('span', 'dz-txt'); txt.append(el('strong', null, title)); if (sub) txt.append(el('small', null, sub));
  const verb = el('span', 'dz-verb', open ? 'Hide' : 'Show'); verb.append(chevron());
  btn.append(txt, verb); const panel = el('div', 'dz-panel'); panel.append(body); if (!open) panel.hidden = true;
  btn.addEventListener('click', () => { const o = btn.getAttribute('aria-expanded') !== 'true'; btn.setAttribute('aria-expanded', String(o)); panel.hidden = !o; verb.firstChild.textContent = o ? 'Hide' : 'Show'; });
  wrap.append(btn, panel); return wrap;
};
const auditParts = () => {
  const parts = [];
  ['Skipped', 'Untouched pre-existing', 'New untracked paths'].map(sec).filter((s) => s && s.count).forEach((s) => {
    const ul = el('ul'); s.items.forEach((x) => ul.append(el('li', null, typeof x === 'string' ? x : x.dir + ' (' + x.n + ' paths)'))); s.notes.forEach((n) => ul.append(el('li', null, n)));
    parts.push({ label: s.label, n: s.count, hint: s.label === 'Skipped' ? 'not generated this run' : s.label === 'Untouched pre-existing' ? 'already in the repo, not managed by onboarding' : 'appeared during the run', body: ul });
  });
  const ul = el('ul'); R.checks.forEach((c) => ul.append(el('li', null, c.key + ': ' + c.value)));
  parts.push({ label: 'Checks', n: R.checks.length, hint: 'every check line, verbatim', body: ul });
  parts.push({ label: 'Text report', n: null, hint: 'the full record this page is drawn from', body: el('pre', null, R.raw) });
  return parts;
};

function audit() {
  const s = el('section', 'chipbar'); s.append(el('span', 'cb-label', 'Audit log'));
  const panel = el('div', 'cb-panel'); panel.hidden = true; let current = null;
  auditParts().forEach((p) => { const b = el('button', 'cb-chip'); b.type = 'button'; b.setAttribute('aria-expanded', 'false'); b.append(p.label); if (p.n != null) b.append(el('b', null, String(p.n))); b.append(chevron());
    b.addEventListener('click', () => { const open = current !== b; s.querySelectorAll('.cb-chip').forEach((c) => c.setAttribute('aria-expanded', 'false')); panel.textContent = ''; current = open ? b : null; panel.hidden = !open;
      if (open) { b.setAttribute('aria-expanded', 'true'); panel.append(el('p', 'note', p.hint), p.body.cloneNode(true)); } });
    s.append(b); });
  const wrap = el('div', 'v-b-audit'); wrap.append(s, panel); return wrap;
}
const SOURCES = 'CLAUDE.md, AGENTS.md, README, CONTRIBUTING.md or your CI workflows';
function finalChecks() {
  const s = el('section', 'b-checks v-a');
  s.append(el('h3', null, 'Pre-flight checklist'), el('p', 'lede', 'The checks your agents run before they ship. Onboarding copies them from where your project already lists them: ' + SOURCES + '. It never runs them.'));
  if (documented) { s.append(el('div', 'b-sub', 'On the checklist · ' + documented.count)); s.append(cmdGroup(documented.items)); }
  if (undeclared) {
    const where = undSources().join(', '); const example = undeclared.groups[0].items[0];
    const note = el('p', 'note');
    note.append('Your agents run only the checks onboarding copied from ' + SOURCES + '. These ' + undeclared.count + ' scripts exist in ' + where + ', but none of those files tell anyone to run them. To have your agents run one, add its exact command to CLAUDE.md (for example ', el('code', null, example), '), then run ', el('code', null, '/onboard'), ' again to update the checklist.');
    const body = el('div'); body.append(note, undBody());
    s.append(disclosure('warn', undeclared.count + ' checks your agents will not run', 'Scripts in ' + where + ' that none of those files mention', body, false));
  }
  return s;
}

const root = document.getElementById('report');
root.classList.add('go-final', 'caution-amber');
buildB(root);
})();
</script>
