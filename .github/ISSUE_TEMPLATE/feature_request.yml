name: Feature request
description: Propose a change to the pack, a skill, or the generated workspace
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >
        What goes wrong today, concretely. Describe the situation, not the
        solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you want Launch Control to do instead.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - install.sh
        - /onboard (discovery, generation, or merge)
        - completion guard / run report
        - generated .claude/settings.json permissions
        - CRISPY delivery skills
        - a new skill or agent
        - tools/validate-pack.sh
        - documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Including doing nothing. Launch Control prefers the smallest change that
        works and keeps optional or heavyweight behavior behind an explicit
        opt-in, so say why an existing mechanism does not already cover this.
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
          required: false
