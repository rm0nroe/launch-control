  <title>Launch Control</title>
  <desc>A launch pad at ignition: the wordmark stands on the deck with its base lit, exhaust burning down into the pad, an ascent arc marked onboard, launch-ticket and launch-backlog, and a go/no-go poll of the gates every delivery passes.</desc>
